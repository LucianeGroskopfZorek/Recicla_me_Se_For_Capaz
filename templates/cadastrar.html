<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Usuário - Recicla-me Se For Capaz</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <header>
        <h1>♻️ Recicla-me Se For Capaz</h1>
        <p>Sistema de Gestão de Coleta Seletiva</p>
    </header>

    <nav>
        <a href="/">Início</a>
        <a href="/usuarios">Usuários</a>
        <a href="/cadastrar">Cadastrar</a>
        <a href="/bairros">Bairros</a>
        <a href="/coletas">Coletas</a>
    </nav>

    <main>
        <div class="card">
            <h2>➕ Cadastrar Novo Usuário</h2>
            <form method="POST" action="/cadastrar">
                <div class="campo">
                    <label>Nome</label>
                    <input type="text" name="nome" placeholder="Nome completo" required>
                </div>
                <div class="campo">
                    <label>CPF</label>
                    <input type="text" name="cpf" placeholder="Somente números" required>
                </div>
                <div class="campo">
                    <label>Data de Nascimento</label>
                    <input type="date" name="data_nascimento" required>
                </div>
                <div class="campo">
                    <label>Email</label>
                    <input type="email" name="email" placeholder="email@exemplo.com" required>
                </div>
                <div class="campo">
                    <label>Telefone</label>
                    <input type="text" name="telefone" placeholder="Ex: 47999999999">
                </div>
                <div class="campo">
                    <label>Usuário</label>
                    <input type="text" name="usuario" placeholder="Nome de usuário" required>
                </div>
                <div class="campo">
                    <label>Senha</label>
                    <input type="password" name="senha_hash" placeholder="Senha" required>
                </div>
                <button type="submit">✅ Cadastrar</button>
            </form>
        </div>
    </main>

</body>
</html>
