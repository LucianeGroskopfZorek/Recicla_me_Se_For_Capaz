<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recicla-me Se For Capaz · Check-in do Motorista</title>
<link rel="stylesheet" href="{{ url_for('static', filename='checkin.css') }}">
</head>
<body>
<div class="app">

  <header>
    <div class="eyebrow">Recicla-me Se For Capaz</div>
    <h1>Check-in de Coleta</h1>
    <div class="subtitle">Marque o início da sua rota para registrar o ponto de presença.</div>
  </header>

  <main>

    <div class="card rota-select">
      <label for="rota">Bairro / Rota de hoje</label>
      <select id="rota">
        <option value="">Selecione a rota</option>
        <option>Centro</option>
        <option>Alto das Palmeiras</option>
        <option>Marcílio Dias</option>
        <option>Água Verde</option>
        <option>Rio das Pedras</option>
      </select>
    </div>

    <div class="card">
      <div class="stamp-zone">
        <div class="stamp" id="stamp">
          <div class="stamp-icon" id="stampIcon">🚛</div>
          <div class="stamp-label" id="stampLabel">Aguardando</div>
        </div>

        <button class="acao" id="btnCheckin">Marcar presença agora</button>
        <div class="status-msg" id="statusMsg"></div>

        <div class="coords" id="coordsBox">
          <div><b>Latitude:</b> <span id="lat">--</span></div>
          <div><b>Longitude:</b> <span id="lng">--</span></div>
          <div><b>Precisão:</b> <span id="acc">--</span> m</div>
          <div><b>Horário:</b> <span id="hora">--</span></div>
        </div>
      </div>
    </div>

    <div class="card historico">
      <h2>Check-ins de hoje</h2>
      <div id="listaHistorico">
        <div class="vazio">Nenhum check-in registrado ainda.</div>
      </div>
    </div>

  </main>
</div>

<script>
  const btn = document.getElementById('btnCheckin');
  const stamp = document.getElementById('stamp');
  const stampIcon = document.getElementById('stampIcon');
  const stampLabel = document.getElementById('stampLabel');
  const statusMsg = document.getElementById('statusMsg');
  const coordsBox = document.getElementById('coordsBox');
  const listaHistorico = document.getElementById('listaHistorico');
  const rotaSelect = document.getElementById('rota');

  let historico = [];

  btn.addEventListener('click', () => {
    const rota = rotaSelect.value;
    if(!rota){
      statusMsg.textContent = 'Selecione a rota antes de marcar presença.';
      statusMsg.className = 'status-msg erro';
      return;
    }

    if(!('geolocation' in navigator)){
      statusMsg.textContent = 'Este dispositivo não suporta geolocalização.';
      statusMsg.className = 'status-msg erro';
      return;
    }

    btn.disabled = true;
    statusMsg.textContent = 'Obtendo localização...';
    statusMsg.className = 'status-msg';

    navigator.geolocation.getCurrentPosition(sucesso, erro, {
      enableHighAccuracy: true,
      timeout: 10000,
      maximumAge: 0
    });
  });

  function sucesso(posicao){
    const { latitude, longitude, accuracy } = posicao.coords;
    const agora = new Date();
    const horaFormatada = agora.toLocaleTimeString('pt-BR');

    document.getElementById('lat').textContent = latitude.toFixed(6);
    document.getElementById('lng').textContent = longitude.toFixed(6);
    document.getElementById('acc').textContent = accuracy.toFixed(0);
    document.getElementById('hora').textContent = horaFormatada;
    coordsBox.classList.add('show');

    stamp.classList.add('confirmado');
    stampIcon.textContent = '✓';
    stampLabel.textContent = 'Confirmado';

    statusMsg.textContent = 'Presença registrada com sucesso.';
    statusMsg.className = 'status-msg ok';

    enviarParaServidor({
      rota: rotaSelect.value,
      latitude: latitude,
      longitude: longitude,
      precisao: accuracy,
      horario: agora.toISOString()
    });

    adicionarAoHistorico(rotaSelect.value, horaFormatada);

    btn.disabled = false;
  }

  function erro(err){
    let msg = 'Não foi possível obter sua localização.';
    if(err.code === err.PERMISSION_DENIED){
      msg = 'Permissão de localização negada. Ative o GPS e permita o acesso.';
    } else if(err.code === err.TIMEOUT){
      msg = 'Tempo esgotado ao tentar localizar o dispositivo.';
    }
    statusMsg.textContent = msg;
    statusMsg.className = 'status-msg erro';
    btn.disabled = false;
  }

  function adicionarAoHistorico(rota, hora){
    historico.unshift({ rota, hora });

    if(listaHistorico.querySelector('.vazio')){
      listaHistorico.innerHTML = '';
    }

    const item = document.createElement('div');
    item.className = 'item-historico';
    item.innerHTML = `
      <div class="item-info">
        <b>${rota}</b>
        <span>${hora}</span>
      </div>
      <div class="badge">Registrado</div>
    `;
    listaHistorico.prepend(item);
  }

  async function enviarParaServidor(dados){
    try {
      const resposta = await fetch('/api/checkin', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(dados)
      });
      if(!resposta.ok) throw new Error('Falha ao enviar check-in');
      const resultado = await resposta.json();
      console.log('Servidor confirmou:', resultado);
    } catch(e) {
      console.error('Erro ao enviar check-in:', e);
    }
  }
</script>
</body>
</html>
