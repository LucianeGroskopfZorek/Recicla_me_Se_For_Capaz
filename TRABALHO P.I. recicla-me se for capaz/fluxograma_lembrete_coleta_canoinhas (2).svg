<svg width="100%" viewBox="0 0 680 680" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Fluxograma 3 adaptado – Lembrete de coleta para o morador</title>
  <desc>Fluxo adaptado para Canoinhas SC onde a coleta já tem dias fixos por bairro</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: sans-serif; fill: #2c2c2a; }
      .th { font-size: 14px; font-weight: 500; }
      .ts { font-size: 12px; font-weight: 400; fill: #5f5e5a; }
      .c-gray rect { fill: #f1efe8; stroke: #5f5e5a; }
      .c-gray text { fill: #2c2c2a; }
      .c-purple rect { fill: #eeedfe; stroke: #534ab7; }
      .c-purple text { fill: #26215c; }
      .c-purple .ts { fill: #3c3489; }
      .c-amber rect { fill: #faeeda; stroke: #854f0b; }
      .c-amber text { fill: #412402; }
      .c-amber .ts { fill: #633806; }
      .c-teal rect { fill: #e1f5ee; stroke: #0f6e56; }
      .c-teal text { fill: #04342c; }
      .c-teal .ts { fill: #085041; }
      .c-green rect { fill: #eaf3de; stroke: #3b6d11; }
      .c-green text { fill: #173404; }
      .c-green .ts { fill: #27500a; }
      .c-coral rect { fill: #faece7; stroke: #993c1d; }
      .c-coral text { fill: #4a1b0c; }
      .c-coral .ts { fill: #712b13; }
      .arr { stroke: #888780; stroke-width: 1.5; fill: none; }
    </style>
  </defs>

  <!-- Título -->
  <text class="th" x="340" y="30" text-anchor="middle">Fluxo 3 (adaptado) — lembrete de coleta ao morador</text>
  <text class="ts" x="340" y="48" text-anchor="middle">Canoinhas SC — coleta com dias fixos por bairro</text>

  <!-- INÍCIO -->
  <g class="c-gray">
    <rect x="240" y="60" width="200" height="44" rx="22" stroke-width="0.5"/>
    <text class="th" x="340" y="82" text-anchor="middle" dominant-baseline="central">Início</text>
  </g>
  <line x1="340" y1="104" x2="340" y2="135" class="arr" marker-end="url(#arrow)"/>

  <!-- Passo 1 -->
  <g class="c-purple">
    <rect x="190" y="135" width="300" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="156" text-anchor="middle" dominant-baseline="central">Morador se cadastra no sistema</text>
    <text class="ts" x="340" y="174" text-anchor="middle" dominant-baseline="central">Informa nome, bairro e contato</text>
  </g>
  <line x1="340" y1="191" x2="340" y2="222" class="arr" marker-end="url(#arrow)"/>

  <!-- Passo 2 -->
  <g class="c-purple">
    <rect x="190" y="222" width="300" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="243" text-anchor="middle" dominant-baseline="central">Sistema identifica o bairro</text>
    <text class="ts" x="340" y="261" text-anchor="middle" dominant-baseline="central">Busca o dia fixo de coleta</text>
  </g>
  <line x1="340" y1="278" x2="340" y2="309" class="arr" marker-end="url(#arrow)"/>

  <!-- Decisão -->
  <g class="c-amber">
    <rect x="175" y="309" width="330" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="330" text-anchor="middle" dominant-baseline="central">Bairro tem dia de coleta cadastrado?</text>
    <text class="ts" x="340" y="348" text-anchor="middle" dominant-baseline="central">Verifica tabela de bairros</text>
  </g>

  <!-- NÃO -->
  <line x1="175" y1="337" x2="100" y2="337" class="arr" marker-end="url(#arrow)" stroke="#BA7517"/>
  <text class="ts" x="135" y="330" text-anchor="middle">Não</text>
  <line x1="100" y1="337" x2="100" y2="510" class="arr" marker-end="url(#arrow)" stroke="#BA7517"/>

  <g class="c-coral">
    <rect x="32" y="510" width="236" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="150" y="531" text-anchor="middle" dominant-baseline="central">Avisa o morador</text>
    <text class="ts" x="150" y="549" text-anchor="middle" dominant-baseline="central">"Bairro ainda não cadastrado"</text>
  </g>
  <line x1="150" y1="566" x2="150" y2="610" class="arr" marker-end="url(#arrow)"/>
  <g class="c-gray">
    <rect x="50" y="610" width="200" height="44" rx="22" stroke-width="0.5"/>
    <text class="th" x="150" y="632" text-anchor="middle" dominant-baseline="central">Fim</text>
  </g>

  <!-- SIM -->
  <line x1="340" y1="365" x2="340" y2="396" class="arr" marker-end="url(#arrow)"/>
  <text class="ts" x="356" y="384">Sim</text>

  <!-- Passo 3 -->
  <g class="c-teal">
    <rect x="190" y="396" width="300" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="417" text-anchor="middle" dominant-baseline="central">Exibe dia e horário da coleta</text>
    <text class="ts" x="340" y="435" text-anchor="middle" dominant-baseline="central">Ex: toda terça-feira, a partir das 7h</text>
  </g>
  <line x1="340" y1="452" x2="340" y2="483" class="arr" marker-end="url(#arrow)"/>

  <!-- Passo 4 -->
  <g class="c-teal">
    <rect x="190" y="483" width="300" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="504" text-anchor="middle" dominant-baseline="central">Sistema envia lembrete</text>
    <text class="ts" x="340" y="522" text-anchor="middle" dominant-baseline="central">Um dia antes da coleta no bairro</text>
  </g>
  <line x1="340" y1="539" x2="340" y2="570" class="arr" marker-end="url(#arrow)"/>

  <!-- Passo 5 -->
  <g class="c-green">
    <rect x="190" y="570" width="300" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="591" text-anchor="middle" dominant-baseline="central">Morador confirma participação</text>
    <text class="ts" x="340" y="609" text-anchor="middle" dominant-baseline="central">Sistema registra o engajamento</text>
  </g>
  <line x1="340" y1="626" x2="340" y2="654" class="arr" marker-end="url(#arrow)"/>

  <!-- FIM -->
  <g class="c-gray">
    <rect x="240" y="654" width="200" height="44" rx="22" stroke-width="0.5"/>
    <text class="th" x="340" y="676" text-anchor="middle" dominant-baseline="central">Fim</text>
  </g>
</svg>
